# 本地开发环境 - MongoDB 容器
# 用法: docker compose up -d
# 后端和前端继续在本地运行，仅数据库容器化

services:
  mongodb:
    image: mongo:7
    container_name: case-library-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: case_library
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
