name: Codex Review Required

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check-codex-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check Codex review comment
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = process.env.HEAD_SHA;
            const shortSha = headSha.slice(0, 10);
            const codexLogins = new Set([
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);
            const deadline = Date.now() + 10 * 60 * 1000;

            while (Date.now() < deadline) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number,
                per_page: 100,
              });

              const codexReview = reviews
                .filter((review) =>
                  codexLogins.has(review.user?.login) &&
                  review.commit_id === headSha
                )
                .find((review) => /Codex Review:/i.test(review.body || ''));

              if (codexReview) {
                core.info(`Codex PR review found for ${headSha}: ${codexReview.html_url}`);
                return;
              }

              const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner,
                repo,
                pull_number,
                per_page: 100,
              });

              const codexReviewComment = reviewComments.find((comment) =>
                codexLogins.has(comment.user?.login) &&
                comment.commit_id === headSha &&
                (comment.body || '').includes(shortSha)
              );

              if (codexReviewComment) {
                core.info(`Codex review comment found for ${headSha}: ${codexReviewComment.html_url}`);
                return;
              }

              core.info('Waiting for Codex review on the current head commit...');
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            core.setFailed('Codex review is required for the current head commit before merging. Trigger it with "@codex review" or mark the PR ready for review.');
